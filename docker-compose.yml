services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: prawowid-vector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base_main}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_base}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_base_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prawowid-vector-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_base} -d ${POSTGRES_DB:-knowledge_base_main}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  prawowid-vector-data:
