<!doctype html>
<!--
  Source of public/og.png (the 1200x630 link-preview banner for Discord, Messenger, WhatsApp, X…).
  Regenerate: open this file in a headless browser at 1200x630, DPR 1, and screenshot it, e.g.
    npx playwright screenshot --viewport-size=1200,630 apps/web/scripts/og-image.html apps/web/public/og.png
  (open via file:// so the font paths below resolve to apps/web/node_modules).
  Same look as the site in dark mode: navy panel, Newsreader headline, Inter Tight text, rosette mark.
-->
<html lang="pl">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Newsreader"; font-weight: 200 800; src: url("../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-ext-opsz-normal.woff2") format("woff2"); unicode-range: U+0100-024F; }
  @font-face { font-family: "Newsreader"; font-weight: 200 800; src: url("../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Inter Tight"; font-weight: 100 900; src: url("../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-024F; }
  @font-face { font-family: "Inter Tight"; font-weight: 100 900; src: url("../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #050d1a; color: #eef1f6; font-family: "Inter Tight", sans-serif; padding: 28px; }
  .panel {
    position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden;
    background:
      radial-gradient(60% 70% at 78% 30%, rgb(157 183 255 / .10) 0%, transparent 70%),
      radial-gradient(120% 80% at 50% 28%, #14233a 0%, #0e1a2d 62%);
    padding: 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 16px; font: 400 40px/1 "Newsreader", serif; letter-spacing: -.03em; }
  .brand svg { width: 52px; height: 52px; }
  .brand path { fill: none; stroke: #9db7ff; stroke-width: 4.5; }
  h1 { font: 400 108px/.98 "Newsreader", serif; letter-spacing: -.055em; max-width: 9.5em; }
  p { font-size: 32px; line-height: 1.35; letter-spacing: -.012em; color: rgb(238 241 246 / .78); max-width: 28em; }
  .big { position: absolute; right: -150px; top: 50%; width: 620px; height: 620px; transform: translateY(-50%); opacity: .16; }
  .big path { fill: none; stroke: #9db7ff; stroke-width: 1.4; }
  .copy { position: relative; display: grid; gap: 22px; }
</style>
</head>
<body>
  <div class="panel">
    <svg class="big" data-rosette viewBox="-100 -100 200 200" aria-hidden="true"></svg>
    <div class="brand"><svg data-rosette viewBox="-100 -100 200 200"></svg>Prawdomat</div>
    <div class="copy">
      <h1>Sprawdź, zanim udostępnisz</h1>
      <p>Bezpłatne sprawdzanie faktów ze źródłami.</p>
    </div>
  </div>
  <script>
    // Same geometry as src/lib/rosette.ts (ROSETTES.mark).
    function ring(r0, amp, lobes, phase, steps) {
      let d = "";
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const r = r0 + amp * Math.sin(lobes * t + phase) + amp * 0.35 * Math.sin((lobes * 2 + 1) * t - phase * 2);
        d += (i ? "L" : "M") + (r * Math.cos(t)).toFixed(2) + " " + (r * Math.sin(t)).toFixed(2);
      }
      return d + "Z";
    }
    const o = { rings: 7, lobes: 6, radius: 66, amplitude: 16, innerRadius: 28, innerAmplitude: 10, innerLobes: 4, steps: 360 };
    const paths = [];
    for (let i = 0; i < o.rings; i++) paths.push(ring(o.radius, o.amplitude, o.lobes, (i / o.rings) * Math.PI * 2, o.steps));
    const n = Math.max(4, Math.round(o.rings / 2));
    for (let i = 0; i < n; i++) paths.push(ring(o.innerRadius, o.innerAmplitude, o.innerLobes, (i / n) * Math.PI * 2, o.steps));
    for (const svg of document.querySelectorAll("svg[data-rosette]")) {
      for (const d of paths) {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        svg.append(p);
      }
    }
  </script>
</body>
</html>
